[pytest]
testpaths = tests
python_files = test_*.py
asyncio_default_fixture_loop_scope = function

markers =
    integration: 需要真实外部服务（ixBrowser / 网络）的集成测试

# 以下两个是需要真实 ixBrowser 服务的手动诊断脚本，不是 pytest 用例：
#   tests/test.py               —— 模块级直接调用 get_browser_list()，收集阶段即发起网络请求
#   tests/test_ixbrowser_api.py —— 模块级替换 sys.stdout，会破坏 pytest 的输出捕获
# 手动运行方式：python tests/test_ixbrowser_api.py
addopts =
    --ignore=tests/test.py
    --ignore=tests/test_ixbrowser_api.py
